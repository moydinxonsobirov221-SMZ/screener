name: monitor
on:
  schedule:
    - cron: "5,35 8-23 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan yoki update"
        default: "scan"
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore sent state
        uses: actions/cache@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - run: pip install yfinance pandas requests
      - name: Run
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python monitor.py "${{ github.event.inputs.mode || ((github.event.schedule == '30 20 * * 1-5' || github.event.schedule == '30 21 * * 1-5') && 'update' || 'scan') }}"
      - name: Save
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git rm -q --cached sent.json 2>/dev/null || true
          echo "sent.json" >> .git/info/exclude
          git add data.db
          if ! git diff --cached --quiet; then
            git commit -m "auto update"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then ok=1; break; fi
              git rebase --abort || true
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
          fi
